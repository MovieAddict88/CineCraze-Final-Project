<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - CineCraze</title>
  <meta name="theme-color" content="#e50914" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif; background: #141414; color: #f5f5f5; display: grid; min-height: 100vh; place-items: center; }
    .card { width: min(560px, 92vw); background: #1a1a1a; padding: 24px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.5); text-align: center; }
    h1 { margin-top: 0; color: #e50914; }
    p { color: #aaaaaa; line-height: 1.6; }
    .actions { margin-top: 20px; display: flex; gap: 12px; justify-content: center; }
    a, button { background: #e50914; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; text-decoration: none; }
    a.secondary { background: #333; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>CineCraze can't reach the network. Some features may be unavailable, but you can still browse previously visited pages.</p>
    <div class="actions">
      <a class="secondary" href="/index.php">Try Home</a>
      <button onclick="location.reload()">Retry</button>
    </div>
  </div>
</body>
</html>
